        certificate:
          $ref: '#/components/schemas/DataRSACertificate'
    DataRSACertificate:
      description: Данные сертификата
      type: object
      properties:
        id:
          description: Идентификатор сертификата
          type: string
          example: 62552f2457595f1652c4b179
        serialNumber:
          description: Серийный номер сертификата
          type: string
          example: 6100035c3cff88cd00f01d734a000100035c3c
        tokenKeyId:
          description: Идентификатор закрытого ключа на токене
          type: string
          example: AlboKey_{BBB5EB5D-2B38-488B-B9E2-5E336DDE3DE9}
        tokenSerialNumber:
          description: Серийный номер токена на который загружен сертификат
          type: string
          example: 00a81050
        status:
          description: Статус сертификата
          type: string
          example: CERT_VALID
        notBefore:
          description: Дата начала действия сертификата
          type: string
          format: date-time
        notAfter:
          description: Дата завершения действия сертификата
          type: string
          format: date-time
        owner:
          description: ФИО владельца сертификата
          type: string
          example: Ефимов Филипп Архипович
        uploadOnToken:
          description: Признак загрузки сертификата на токен
          type: boolean
        expireSoon:
          description: Признак необходимости перевыпуска сертификата, по причине завершения действия
          type: boolean
        actions:
          $ref: '#/components/schemas/ActionsRSACertificate'
    ActionsRSACertificate:
      description: Список всех возможных действий над сертификатом
      type: array
      items:
        $ref: '#/components/schemas/RsaCertificateAction'
    RsaCertificateAction:
      type: object
      properties:
        type:
          description: Тип действия
          type: string
          example: UPLOAD_ON_TOKEN
        available:
          description: Признак доступности действия
          type: boolean
    SignSettings:
      description: Тип основной подписи
      type: object
      required:
      - currentSignType
      properties:
        currentSignType:
          description: Тип основной подписи
          type: string
          example: rsa-certificates
          enum:
          - rsa-certificates
          - qes
    ResponseDN:
      description: Данные DN(Distinguished Name)
      type: object
      properties:
        dn:
          description: Данные DN(Distinguished Name)
          type: string
          example: emailAddress=teterkina.natalya@gmail.com, CN=Тетеркина Наталья Геннадьевна, C=RU, SN=Тетеркина, GN=Наталья
    ResponseSignMethods:
      type: array
      items:
        $ref: '#/components/schemas/SignMethodsChannel'
    SignMethodsChannel:
      type: object
      properties:
        channel:
          type: string
          description: Канал
        signMethods:
          type: array
          items:
            $ref: '#/components/schemas/SignMethod'
    SignMethod:
      type: object
      properties:
        type:
          type: string
          description: Способ подписи
          enum:
          - SMS
          - RSA
          - QES
          - PAYCONTROL
          - MYDSS
          - GK_NES
          - GK_QES
        status:
          type: string
          description: Статус способа подписи
        current:
          type: boolean
          description: Признак выбранного основным способом подписи
        skipAddAllSignMethods:
          type: boolean
          description: Признак добавления дополнительных способов подписи
        resourceGroup:
          $ref: '#/components/schemas/SignResourceGroup'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/SignMethodAction'
    SignResourceGroup:
      type: object
      properties:
        resources:
          type: array
          items:
            $ref: '#/components/schemas/SignResource'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/SignResourceGroupAction'
    SignResource:
      type: object
      properties:
        id:
          type: string
          description: Идентификатор ресурса
        type:
          type: string
          description: Тип ресурса
        actions:
          type: array
          items:
            $ref: '#/components/schemas/SignResourceAction'
        used:
          type: boolean
          description: Признак, является ли ресурс используемым для подписания
        phoneNumber:
          type: string
          description: Номер телефона
        snilsNumber:
          type: string
          description: Номер СНИЛС
        serialNumber:
          type: string
          description: Номер сертификата
        tokenKeyId:
          type: string
          description: Идентификатор закрытого ключа
        tokenSerialNumber:
          type: string
          description: Серийный номер USB-токена
        status:
          type: string
          description: Текущий статус сертификата
          enum:
          - CERT_VALID
          - CERT_REVOKED
          - CERT_EXPIRED
          - CERT_INVALID
          - UNKNOWN
        notBefore:
          type: string
          format: date-time
          description: Дата выпуска сертификата
        notAfter:
          type: string
          format: date-time
          description: Дата истечения срока действия сертификата
        owner:
          type: string
          description: Владелец сертификата
        uploadOnToken:
          type: boolean
          description: Признак, загружен ли сертификат на USB-токен
        expireSoon:
          type: boolean
          description: Признак необходимости перевыпуска сертификата
    SignResourceAction:
      type: object
      properties:
        type:
          type: string
          description: Тип действия
        available:
          type: boolean
          description: Признак доступности действия
    SignResourceGroupAction:
      type: object
      properties:
        type:
          type: string
          description: Тип действия
        available:
          type: boolean
          description: Признак использования действия
    SignMethodAction:
      type: object
      properties:
        type:
          type: string
          description: Тип действия
          enum:
          - ENABLE
          - SWITCH_RESOURCE
          - SET_CURRENT
          - DISABLE
        available:
          type: boolean
          description: Признак доступности действия
        code:
          type: string
          description: Код причины в случае недоступности действия
    RegisterPoaRequest:
      type: object
      description: Данные для регистрации МЧД
      required:
      - poaNumber
      - issuerInn
      - confidantInn
      properties:
        poaNumber:
          type: string
          format: uuid
          description: Номер доверенности
          example: 8e08423a-bcc0-4fba-a791-9825cb1a7cb3
        issuerInn:
          type: string
          pattern: ^((\d{10})|(\d{12}))$
          description: ИНН доверителя
          example: '4205335615'
        confidantInn:
          type: string
          pattern: ^((\d{10})|(\d{12}))$
          description: ИНН доверенного лица
          example: '4205335615'
    RegisterPoaResponse:
      type: object
      properties:
        id:
          type: string
          description: Идентификатор запроса в системе МЧД
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
      required:
      - id
    GetPoaStatus:
      type: object
      description: Объект предоставляет статус скачивания полной версии машиночитаемой доверенности
      properties:
        status:
          type: string
          enum:
          - COMPLETE
          - PENDING
          - FAILED
          - TIMEOUT
          description: "Статус машиночитаемой доверенности (МЧД). Принимает возможные значения:\n  * `COMPLETE` - Операция завершена;\n  * `PENDING`\
            \ - Операция выполняется. Идет запрос данных с узла ФНС;\n  * `FAILED` - Ошибка;\n  * `TIMEOUT` - Превышен лимит ожидания\n"
          example: COMPLETE
      required:
      - status
    SendRequestQes:
      type: object
      required:
      - type
      properties:
        type:
          description: Тип заявки
          type: string
    SendRequestQesResponse:
      type: object
      required:
      - id
      - type
      - content
      properties:
        id:
          type: string
          description: Идентификатор заявки
          example: 63160a37e27edd0c316567a6
        type:
          description: Тип заявки
          type: string
          enum:
          - enableQesSignType
        content:
          type: string
          description: Документ на подпись в формате base64
    SignRequestQes:
      type: object
      required:
      - type
      - signature
      properties:
        type:
          description: Тип заявки
          type: string
        signature:
          type: string
          minLength: 1
          description: Значение электронной подписи, закодированное в base64
    SignRequestQesResponse:
      type: object
      required:
      - id
      - type
      - isSigned
      properties:
        id:
          type: string
          description: Идентификатор заявки
          example: 63160a37e27edd0c316567a6
        type:
          description: Тип заявки
          type: string
          enum:
          - enableQesSignType
        isSigned:
          type: boolean
          description: Признак достаточности подписей
          example: true
    RequestType:
      type: string
      description: "Тип заявки. Возможные значения:\n  * `enableQesSignType` - заявка на подключение способа подписи КЭП\n"
      example: enableQesSignType
    ErrorBadRequest:
      description: Неверные входные параметры запроса
      x-class-extra-annotation: '@lombok.AllArgsConstructor'
      type: object
      required:
      - error
      properties:
        error:
          description: Код ошибки
          type: string
          example: invalid_request
        error_description:
          description: Сообщение об ошибке
          type: string
          example: Authorization header is not present in request headers
    ErrorUnauthorized:
      description: Предоставленный токен просрочен, отозван, имеет неправильный формат или недействителен по другим причинам
      x-class-extra-annotation: '@lombok.AllArgsConstructor'
      type: object
      required:
      - error
      properties:
        error:
          description: Код ошибки
          type: string
          example: invalid_token
        error_description:
          description: Сообщение об ошибке
          type: string
          example: The access token provided is expired, revoked, malformed, or invalid for other reasons
    ErrorScope:
      description: У пользователя нет прав на использование запрашиваемого сервиса, доступ к которому не предусмотрен настройками scope
      x-class-extra-annotation: '@lombok.AllArgsConstructor'
      type: object
      required:
      - error
      properties:
        error:
          description: Код ошибки
          type: string
          example: insufficient_scope
        error_description:
          description: Сообщение об ошибке
          type: string
          example: The request requires higher privileges than provided by the access token
    ErrorNotFound:
      description: Эндпоинт не найден или неактивен
      x-class-extra-annotation: '@lombok.AllArgsConstructor'
      type: object
      required:
      - error
      properties:
        error:
          description: Код ошибки
          type: string
          example: unknown_route
        error_description:
          description: Сообщение об ошибке
          type: string
          example: Route is not found or not active
    ErrorConflict:
      description: Конфликт
      x-class-extra-annotation: '@lombok.AllArgsConstructor'
      type: object
      required:
      - error
      properties:
        error:
          description: Код ошибки
          type: string
          example: conflict
        error_description:
          description: Сообщение об ошибке
          type: string
          example: Request could not be processed because of conflict in the request
    ErrorInternal:
      description: Внутренняя ошибка сервиса при выполнении обработки запроса
      x-class-extra-annotation: '@lombok.AllArgsConstructor'
      type: object
      required:
      - error
      properties:
        error:
          description: Код ошибки
          type: string
          example: internal_error
        error_description:
          description: Сообщение об ошибке
          type: string
          example: Internal server error
