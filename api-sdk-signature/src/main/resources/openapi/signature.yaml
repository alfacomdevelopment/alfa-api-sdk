components:
  schemas:
    ResponseDNcnf:
      type: string
      description: Данные DN (Distinguished Name) пользователя в формате .cnf
    PowerOfAttorneyDocument:
      type: string
      format: binary
      description: Документ доверенности в бинарном формате
    EnableQesResponse:
      type: object
      properties:
        id:
          type: string
          description: Идентификатор заявки
          example: 63160a37e27edd0c316567a6
        type:
          type: string
          description: Тип заявки
          example: enableQesSignMethodRequest
        status:
          type: string
          description: Статус заявки
          example: CREATED
        createdBy:
          type: string
          description: ФИО создателя заявки
          example: Дмитриев Денис Михайлович
        createdAt:
          type: string
          format: date-time
          description: Дата создания заявки
