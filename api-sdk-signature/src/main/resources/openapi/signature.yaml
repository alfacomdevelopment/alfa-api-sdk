openapi: 3.0.3
info:
  title: Alfa API Signature
  version: 3.0.0
paths:
  /jp/v3/signature/dn:
    get:
      summary: Получение DN пользователя
      operationId: getDn
      parameters:
      - in: header
        required: true
        name: X-AlfaID-Authorization
        schema:
          type: string
          description: Bearer токен доступа, проставленный api-gateway
      - in: header
        required: false
        name: X-Cus
        schema:
          type: string
          description: cus
      - in: header
        required: false
        name: X-Acus
        schema:
          type: string
          description: acus
      tags:
      - SignatureV3
      responses:
        200:
          description: Успешный результат
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDN'
          headers:
            x-traceid:
              schema:
                type: string
              description: Идентификатор трассировки запроса
              example: a57610880b621435
        400:
          description: Неверные входные параметры запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBadRequest'
        401:
          description: Предоставленный токен просрочен, отозван, имеет неправильный формат или недействителен по другим причинам
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorUnauthorized'
        403:
          description: У пользователя нет прав на использование запрашиваемого сервиса, доступ к которому не предусмотрен настройками scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorScope'
        404:
          description: Эндпоинт не найден или неактивен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNotFound'
        429:
          description: Cлишком много запросов в заданный период времени
        500:
          description: Внутренняя ошибка сервиса при выполнении обработки запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInternal'
        503:
          description: Сервер временно недоступен
  /jp/v3/signature/dn/file:
